<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>实验录像叠加工具</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>科学实验录像叠加工具</h1>
  <span id="srcinfo"></span>
</header>
<main>
  <section class="left">
    <video id="player" controls muted></video>
    <div id="scrubbox">
      <h3>拖动预览（显示曲线与精确读数分离）</h3>
      <input type="range" id="scrub" min="0" max="20" step="0.01" value="0">
      <div id="scrub_meta" class="note"></div>
      <div id="scrub_readings"></div>
      <canvas id="scrub_canvas" width="720" height="220"></canvas>
      <p class="note">曲线为稀疏化显示（缺口/回退按原解释着色）；右侧数值来自精确取值路径，
        与逐帧清单同源，稀疏化不参与叠加数值。</p>
    </div>
    <div id="anchorbox">
      <h3>对齐锚点（人工）</h3>
      <table id="anchors"></table>
      <p id="aligninfo" class="note"></p>
    </div>
    <div id="qcbox">
      <h3>QC 校验（闪光↔脉冲样例）</h3>
      <ul id="qc"></ul>
    </div>
  </section>
  <section class="right">
    <h3>渲染参数</h3>
    <label>数据版本
      <select id="data_version"></select>
    </label>
    <label>时间偏移 offset (s)
      <input type="range" id="offset" step="0.005">
      <span id="offset_val"></span>
    </label>
    <label>速率 rate
      <input type="number" id="rate" step="0.0001" value="1.0">
    </label>
    <label>布局
      <select id="layout">
        <option value="bottom">底部曲线条</option>
        <option value="compact">紧凑曲线条</option>
      </select>
    </label>
    <label>曲线窗口 (s)
      <input type="number" id="window_s" step="0.5" value="6">
    </label>
    <div id="fieldcfg"></div>
    <button id="render_btn">渲染候选</button>
    <span id="render_status"></span>

    <h3>候选渲染</h3>
    <table id="renders"></table>
    <h3>已导出（不可变，可复现）</h3>
    <table id="exports"></table>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
